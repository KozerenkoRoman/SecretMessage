services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secret_message_network

  backend:
    image: docker.io/kozerenko/message-api:latest
    container_name: secret_message_api
    restart: always
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "${SOCKET_PORT}:${SOCKET_PORT}"
    environment:
      ENV: production
      PORT: ${PORT}
      SOCKET_PORT: ${SOCKET_PORT}
      AVATAR_BASE_URL: /api/avatars
      AVATAR_UPLOAD_DIR: /data/avatars
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_PROXY_URL: http://frontend:80
      MAX_AVATAR_SIZE_MB: ${MAX_AVATAR_SIZE_MB:-5}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_LOGGING: ${POSTGRES_LOGGING}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      TLS_CACHE_DIR: /certs-cache
      TLS_DOMAINS: ${TLS_DOMAINS}
      TLS_EMAIL: ${TLS_EMAIL}
      TLS_ENABLED: ${TLS_ENABLED}
    volumes:
      - ${AVATAR_UPLOAD_DIR:-./uploads/avatars}:/data/avatars
      - ${TLS_CACHE_DIR:-./uploads/certs}:/certs-cache
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - secret_message_network

  frontend:
    image: docker.io/kozerenko/message-ui:latest
    container_name: secret_message_ui
    restart: always
    env_file: .env
    expose:
      - "80"
    networks:
      - secret_message_network

networks:
  secret_message_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  certs_cache:
    driver: local
