#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./.bin/main.exe ./cmd/backend/main.go"
  bin = "tmp\\main.exe"
  delay = 1000
  include_ext = ["go", "toml", "json", "html"]
  exclude_dir = ["assets", "tmp", "vendor", ".bin", ".git"]
  exclude_regex = ["_test.go"]
  stop_on_error = true
  log = "build-errors.log"

[build.windows]
    cmd = "go build -o ./.bin/main.exe ./cmd/backend/main.go"
    bin = ".bin\\main.exe"
    entrypoint = [".bin\\main.exe"]
    full_bin = ""
    args_bin = []
    post_cmd = []
    pre_cmd = []

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
