version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        emit_json_tags: true
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullTime"
          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
          - db_type: "bigint"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - db_type: "int8"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - db_type: "int"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt32"
          - db_type: "int4"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt32"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt32"
          - db_type: "bigserial"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "bool"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullBool"
          - db_type: "pg_catalog.interval"
            go_type:
              import: "time"
              type: "Duration"