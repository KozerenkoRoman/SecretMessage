services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secret_message_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: secret_message_api
    restart: always
    # ВАЖЛИВО: backend тепер ЄДИНА публічна точка входу (80/443).
    # Він сам термінує TLS через Let's Encrypt/autocert (TLS_ENABLED=true)
    # і проксіює усе, крім /api|/ws, на внутрішній frontend-контейнер
    # (FRONTEND_PROXY_URL=http://frontend:80, без публічного порту нижче).
    ports:
      - "80:80"
      - "443:443"
      - "${SOCKET_PORT}:${SOCKET_PORT}"
    environment:
      - PORT=${PORT}
      - SOCKET_PORT=${SOCKET_PORT}
      - ENV=production
      - POSTGRES_HOST=postgres      
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_POOL_MAX=${POSTGRES_POOL_MAX}
      - POSTGRES_POOL_MIN=${POSTGRES_POOL_MIN}
      - POSTGRES_LOGGING=${POSTGRES_LOGGING}
      - AVATAR_UPLOAD_DIR=/data/avatars
      - AVATAR_BASE_URL=/api/avatars
      - MAX_AVATAR_SIZE_MB=${MAX_AVATAR_SIZE_MB:-5}
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - TLS_DOMAINS=${TLS_DOMAINS}
      - TLS_CACHE_DIR=/certs-cache
      - TLS_EMAIL=${TLS_EMAIL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FRONTEND_PROXY_URL=http://frontend:80
    volumes:
      - avatar_uploads:/data/avatars
      - certs_cache:/certs-cache
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - secret_message_network

  frontend:
    build:
      context: ../../message-ui
      dockerfile: docker/Dockerfile
    container_name: secret_message_ui
    restart: always
    # Більше НЕ публічний контейнер - лише статика SPA всередині
    # docker-мережі, куди backend проксіює через FRONTEND_PROXY_URL.
    expose:
      - "80"
    networks:
      - secret_message_network

networks:
  secret_message_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  avatar_uploads:
    driver: local
  certs_cache:
    driver: local
