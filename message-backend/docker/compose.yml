services:
  bart-dev-minio:
    image: minio/minio:latest
    command: minio server /data/minio --console-address ":9001"
    environment:
      MINIO_ROOT_USER: '${OBJECT_STORAGE_ACCESS_KEY}'
      MINIO_ROOT_PASSWORD: '${OBJECT_STORAGE_SECRET_KEY}'
    ports:
      - "${OBJECT_STORAGE_PORT}:9000"
      - "${OBJECT_STORAGE_CONSOLE_PORT}:9001"

  bart-dev-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${BACKEND_DB_USER}
      - POSTGRES_PASSWORD=${BACKEND_DB_PASSWORD}
      - POSTGRES_DB=${BACKEND_DB_NAME}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${BACKEND_DB_PORT}:5432"

  bart-dev-redis:
    image: redis:7
    entrypoint: redis-server --loglevel warning
    ports:
      - "${BACKEND_REDIS_PORT}:6379"

  bart-dev-meili:
    image: getmeili/meilisearch:v1.12
    environment:
      - MEILI_MASTER_KEY=${BACKEND_SEARCH_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data
    ports:
      - "${BACKEND_SEARCH_PORT}:7700"

  bart-test-minio:
    image: minio/minio:latest
    command: minio server /data/minio
    environment:
      MINIO_ROOT_USER: 'root'
      MINIO_ROOT_PASSWORD: 'password'
    ports:
      - "9200:9000"

  bart-test-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5632:5432"

  bart-test-redis:
    image: redis:7
    entrypoint: redis-server --loglevel warning
    ports:
      - "6579:6379"

  bart-test-meili:
    image: getmeili/meilisearch:v1.12
    environment:
      - MEILI_MASTER_KEY=TEST_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7800:7700"

volumes:
  pg-data:
  meili-data: