services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secret_message_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: secret_message_api
    restart: always
    ports:
      - "${PORT}:${PORT}"      
      - "${SOCKET_PORT}:${SOCKET_PORT}"
    environment:
      - PORT=${PORT}
      - SOCKET_PORT=${SOCKET_PORT}
      - ENV=production
      - POSTGRES_HOST=postgres      
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_POOL_MAX=${POSTGRES_POOL_MAX}
      - POSTGRES_POOL_MIN=${POSTGRES_POOL_MIN}
      - POSTGRES_LOGGING=${POSTGRES_LOGGING}
    depends_on:
      postgres:
        condition: service_healthy 
    networks:
      - secret_message_network

  frontend:
    build:
      context: ../../message-ui
      dockerfile: docker/Dockerfile
    container_name: secret_message_ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - secret_message_network

networks:
  secret_message_network:
    driver: bridge

volumes:
  pgdata:
    driver: local