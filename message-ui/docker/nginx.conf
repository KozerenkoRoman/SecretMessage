# =============================================================================
# ВАЖЛИВО: TLS-термінацію та маршрутизацію /api|/ws тепер бере на себе
# сам Go-бекенд (autocert/Let's Encrypt на портах 80/443, дивись
# message-backend/cmd/backend/main.go та cmd/tlsutil/autocert.go).
# Цей контейнер більше НЕ публічний і НЕ термінує SSL — він лише роздає
# статичні файли SPA ЛОКАЛЬНО в docker-мережі; Go проксіює на нього всі
# запити, що не підпадають під /api/* чи /ws (FRONTEND_PROXY_URL).
# =============================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 6M;
    location / {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}